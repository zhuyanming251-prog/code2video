<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Droid Sans Fallback";
        src: url("assets/fonts/droid-sans-fallback.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      :root {
        --bg-0: #0b1220;
        --bg-1: #14213d;
        --bg-2: #1b263b;
        --muted: #778da9;
        --text: #e8eef7;
        --accent: #2ec4b6;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg-0);
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(ellipse 70% 55% at 50% 42%, rgba(46, 196, 182, 0.12) 0%, transparent 58%),
          radial-gradient(ellipse 90% 70% at 50% 100%, rgba(20, 33, 61, 0.9) 0%, transparent 55%),
          linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 48%, var(--bg-2) 100%);
      }

      .atmosphere {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 18% 22%, rgba(232, 238, 247, 0.04), transparent 28%),
          radial-gradient(circle at 82% 68%, rgba(46, 196, 182, 0.06), transparent 32%);
      }

      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.55) 100%);
      }

      #title-card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 120px 160px;
        gap: 28px;
        text-align: center;
        color: var(--text);
      }

      .brand {
        font-family: "Montserrat", "Droid Sans Fallback", sans-serif;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .rule {
        width: 64px;
        height: 2px;
        background: var(--accent);
        opacity: 0.85;
        border-radius: 1px;
      }

      .headline {
        font-family: "Droid Sans Fallback", "Montserrat", sans-serif;
        font-weight: 400;
        font-size: 96px;
        line-height: 1.15;
        letter-spacing: 0.08em;
        color: var(--text);
        max-width: 1400px;
      }

      .tagline {
        font-family: "Droid Sans Fallback", "Montserrat", sans-serif;
        font-weight: 400;
        font-size: 32px;
        line-height: 1.45;
        letter-spacing: 0.12em;
        color: var(--muted);
        max-width: 1100px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div class="atmosphere" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>

      <section
        id="title-card"
        class="clip"
        data-start="0"
        data-duration="10"
        data-track-index="1"
      >
        <div class="brand" id="brand">AURA</div>
        <div class="rule" id="rule"></div>
        <h1 class="headline" id="headline">重新定义协作</h1>
        <p class="tagline" id="tagline">为现代团队打造的智能工作台</p>
      </section>

      <audio
        id="bgm"
        src="assets/bgm/soft-ambient.mp3"
        data-start="0"
        data-duration="10"
        data-track-index="10"
        data-volume="0.55"
        data-media-start="0"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set(["#brand", "#rule", "#headline", "#tagline"], { autoAlpha: 0 });
      gsap.set(["#brand", "#headline", "#tagline"], { y: 18 });
      gsap.set("#rule", { scaleX: 0.35, transformOrigin: "50% 50%" });

      // Soft fade-in cascade — dominant motif: fade
      tl.to("#brand", { autoAlpha: 1, y: 0, duration: 1.4, ease: "power2.out" }, 0.35);
      tl.to("#rule", { autoAlpha: 1, scaleX: 1, duration: 1.1, ease: "power2.out" }, 1.1);
      tl.to("#headline", { autoAlpha: 1, y: 0, duration: 1.8, ease: "power2.out" }, 2.2);
      tl.to("#tagline", { autoAlpha: 1, y: 0, duration: 1.5, ease: "power2.out" }, 4.6);

      // Soft resolve fade-out
      tl.to(
        ["#brand", "#rule", "#headline", "#tagline"],
        { autoAlpha: 0, duration: 1.2, ease: "power1.in" },
        8.5
      );

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
